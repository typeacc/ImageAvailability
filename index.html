<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Gallery</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        background: #111;
        color: white;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        min-height: 100vh;
    }

    header {
        padding: 22px 25px;
        text-align: center;
    }

    h1 {
        margin: 0;
        font-size: 26px;
        font-weight: 600;
    }

    #status {
        margin-top: 8px;
        color: #999;
        font-size: 14px;
    }

    /* Gallery */
    #gallery {
        width: 100%;
        max-width: 1500px;
        margin: 0 auto;
        padding: 10px 20px 40px;

        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 14px;
    }

    .gallery-item {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        overflow: hidden;
        border-radius: 10px;
        background: #1c1c1c;
        cursor: pointer;
    }

    .gallery-item img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;

        /* Prevent dragging images */
        user-select: none;
        -webkit-user-drag: none;

        transition: transform 0.2s ease;
    }

    .gallery-item:hover img {
        transform: scale(1.04);
    }

    /* Loading placeholder */
    .gallery-item.loading::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
            100deg,
            #1c1c1c 30%,
            #292929 50%,
            #1c1c1c 70%
        );
        background-size: 200% 100%;
        animation: loading 1.2s infinite;
    }

    @keyframes loading {
        from {
            background-position: 200% 0;
        }

        to {
            background-position: -200% 0;
        }
    }

    /* Fullscreen viewer */
    #viewer {
        position: fixed;
        inset: 0;
        z-index: 9999;

        display: none;
        align-items: center;
        justify-content: center;

        background: rgba(0, 0, 0, 0.94);
        padding: 70px 80px;
    }

    #viewer.active {
        display: flex;
    }

    #viewerImage {
        max-width: 100%;
        max-height: 100%;

        width: auto;
        height: auto;

        object-fit: contain;

        user-select: none;
        -webkit-user-drag: none;

        border-radius: 4px;
    }

    /* Close button */
    #closeButton {
        position: fixed;
        top: 18px;
        right: 24px;

        width: 48px;
        height: 48px;

        border: none;
        border-radius: 50%;

        background: rgba(255,255,255,0.12);
        color: white;

        font-size: 34px;
        line-height: 42px;

        cursor: pointer;
        z-index: 10001;

        transition: background 0.15s ease,
                    transform 0.15s ease;
    }

    #closeButton:hover {
        background: rgba(255,255,255,0.25);
        transform: scale(1.08);
    }

    /* Navigation buttons */
    .navButton {
        position: fixed;
        top: 50%;
        transform: translateY(-50%);

        width: 55px;
        height: 75px;

        border: none;
        border-radius: 10px;

        background: rgba(255,255,255,0.12);
        color: white;

        font-size: 38px;

        cursor: pointer;
        z-index: 10000;

        transition: background 0.15s ease,
                    transform 0.15s ease;
    }

    .navButton:hover {
        background: rgba(255,255,255,0.25);
    }

    #previousButton {

    }

    #counter {

        border-radius: 20px;

        background: rgba(0,0,0,0.55);

        font-size: 14px;

        z-index: 10001;
    }

    /* Mobile */
    @media (max-width: 600px) {

        h1 {
            font-size: 22px;

</style>
</head>

<body>

<header>
    <h1>Image Gallery</h1>
    <div id="status">Loading images...</div>
</header>

<main id="gallery"></main>

<!-- Fullscreen viewer -->
<div id="viewer">

    <button id="closeButton" aria-label="Close">×</button>

    <button
        class="navButton"
        id="previousButton"
        aria-label="Previous image"
    >‹</button>

    <img id="viewerImage" alt="">

    <button
        class="navButton"
        id="nextButton"
        aria-label="Next image"
    >›</button>

    <div id="counter"></div>

</div>

<script>
/*
    Repository:
    https://github.com/typeacc/ImageAvailability

    Images:
    /images
*/

const OWNER = "typeacc";
const REPOSITORY = "ImageAvailability";
const BRANCH = "main";
const IMAGE_FOLDER = "images";

const API_URL =
    `https://api.github.com/repos/${OWNER}/${REPOSITORY}/contents/${IMAGE_FOLDER}?ref=${BRANCH}`;

const RAW_BASE =
    `https://raw.githubusercontent.com/${OWNER}/${REPOSITORY}/${BRANCH}/${IMAGE_FOLDER}/`;

const gallery = document.getElementById("gallery");
const statusText = document.getElementById("status");

const viewer = document.getElementById("viewer");
const viewerImage = document.getElementById("viewerImage");

const closeButton = document.getElementById("closeButton");
const previousButton = document.getElementById("previousButton");
const nextButton = document.getElementById("nextButton");

const counter = document.getElementById("counter");

let images = [];
let currentIndex = 0;


/* Supported image formats */
const imageExtensions = [
    ".jpg",
    ".jpeg",
    ".png",
    ".gif",
    ".webp",
    ".avif",
    ".bmp",
    ".svg"
];


/* Check if a filename is an image */
function isImage(filename) {
    const lower = filename.toLowerCase();

    return imageExtensions.some(
        extension => lower.endsWith(extension)
    );
}


/*
    Escape a filename so it works correctly inside URLs.
*/
function imageURL(filename) {
    return RAW_BASE
        + filename
            .split("/")
            .map(part => encodeURIComponent(part))
            .join("/");
}


/*
    Create a thumbnail-style gallery item.

    The browser uses lazy loading so images that are
    far below the screen aren't downloaded immediately.
*/
function createGalleryItem(filename, index) {

    const item = document.createElement("div");

    item.className = "gallery-item loading";

    const img = document.createElement("img");

    img.loading = "lazy";
    img.decoding = "async";

    img.alt = filename;

    /*
        We don't load the image until the browser needs it.
    */
    img.src = imageURL(filename);

    img.onload = () => {
        item.classList.remove("loading");
    };

    img.onerror = () => {
        item.classList.remove("loading");
        item.style.display = "none";
    };

    item.addEventListener("click", () => {
        openViewer(index);
    });

    item.appendChild(img);

    return item;
}


/*
    Get all files from /images using GitHub's API.
*/
async function loadImages() {

    try {

        const response = await fetch(API_URL);

        if (!response.ok) {
            throw new Error(
                `GitHub API returned ${response.status}`
            );
        }

        const files = await response.json();

        images = files
            .filter(file => file.type === "file")
            .filter(file => isImage(file.name))
            .map(file => file.name)
            .sort((a, b) =>
                a.localeCompare(
                    b,
                    undefined,
                    {
                        numeric: true,
                        sensitivity: "base"
                    }
                )
            );

        if (images.length === 0) {

            statusText.textContent =
                "No images found.";

            return;
        }

        statusText.textContent =
            `${images.length} images`;

        /*
            Create all gallery entries.
            Actual image loading is handled by
            the browser's lazy-loading system.
        */
        images.forEach((filename, index) => {

            gallery.appendChild(
                createGalleryItem(filename, index)
            );

        });

    } catch (error) {

        console.error(error);

        statusText.textContent =
            "Could not load the images.";

        gallery.innerHTML = `
            <div style="
                grid-column: 1 / -1;
                text-align: center;
                color: #aaa;
                padding: 50px 20px;
            ">
                Failed to load the image list from GitHub.
            </div>
        `;
    }
}


/*
    Open fullscreen viewer.
*/
function openViewer(index) {

    if (!images.length) return;

    currentIndex = index;

    viewer.classList.add("active");

    document.body.style.overflow = "hidden";

    showCurrentImage();
}


/*
    Display the current full-resolution image.
*/
function showCurrentImage() {

    const filename = images[currentIndex];

    /*
        Only now do we load the full-resolution image.
    */
    viewerImage.src = imageURL(filename);

    viewerImage.alt = filename;

    counter.textContent =
        `${currentIndex + 1} / ${images.length}`;

    /*
        Hide arrows when there is only one image.
    */
    previousButton.style.display =
        images.length > 1 ? "block" : "none";

    nextButton.style.display =
        images.length > 1 ? "block" : "none";
}


/*
    Previous image.
*/
function previousImage() {

    if (!images.length) return;

    currentIndex =
        (currentIndex - 1 + images.length)
        % images.length;

    showCurrentImage();
}


/*
    Next image.
*/
function nextImage() {

    if (!images.length) return;

    currentIndex =
        (currentIndex + 1)
        % images.length;

    showCurrentImage();
}


/*
    Close viewer.
*/
function closeViewer() {

    viewer.classList.remove("active");

    document.body.style.overflow = "";

    /*
        Free the full-resolution image from memory
        when the viewer closes.
    */
    viewerImage.src = "";
}


/* Button controls */
closeButton.addEventListener(
    "click",
    closeViewer
);

previousButton.addEventListener(
    "click",
    previousImage
);

nextButton.addEventListener(
    "click",
    nextImage
);


/*
    Clicking the dark area closes the viewer.

    Clicking the actual image does NOT close it.
*/
viewer.addEventListener("click", event => {

    if (event.target === viewer) {
        closeViewer();
    }

});


/*
    Keyboard controls.
*/
document.addEventListener("keydown", event => {

    if (!viewer.classList.contains("active")) {
        return;
    }

    if (event.key === "Escape") {
        closeViewer();
    }

    if (event.key === "ArrowLeft") {
        previousImage();
    }

    if (event.key === "ArrowRight") {
        nextImage();
    }

});


/*
    Start loading the gallery.
*/
loadImages();
</script>

</body>
</html>
