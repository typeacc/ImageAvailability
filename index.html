<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Image Gallery</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #111;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
}


/* =========================
   HEADER
========================= */

header {
    padding: 24px 20px 18px;
    text-align: center;
}

h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 600;
}

#status {
    margin-top: 8px;
    color: #888;
    font-size: 14px;
}


/* =========================
   MASONRY GALLERY
========================= */

#gallery {
    width: 100%;
    max-width: 1600px;

    margin: 0 auto;
    padding: 8px 16px 40px;

    column-count: 5;
    column-gap: 14px;
}


/*
    Each image stays at its natural
    aspect ratio.
*/

.gallery-item {
    position: relative;

    width: 100%;

    margin: 0 0 14px;

    break-inside: avoid;
    -webkit-column-break-inside: avoid;

    border-radius: 10px;

    overflow: hidden;

    background: #1b1b1b;

    cursor: pointer;

    opacity: 0;

    transform: translateY(5px);

    transition:
        opacity 0.25s ease,
        transform 0.25s ease;
}


.gallery-item.loaded {
    opacity: 1;
    transform: translateY(0);
}


/* Image itself */

.gallery-item img {
    display: block;

    width: 100%;
    height: auto;

    /*
        IMPORTANT:
        Do NOT use object-fit here.

        That would crop the images.
    */

    user-select: none;
    -webkit-user-drag: none;

    transition: transform 0.2s ease;
}


.gallery-item:hover img {
    transform: scale(1.025);
}


/* Loading placeholder */

.gallery-item::before {
    content: "";

    position: absolute;

    inset: 0;

    min-height: 120px;

    background:
        linear-gradient(
            100deg,
            #1b1b1b 30%,
            #292929 50%,
            #1b1b1b 70%
        );

    background-size: 200% 100%;

    animation: loading 1.2s infinite;

    z-index: 0;
}


.gallery-item img {
    position: relative;
    z-index: 1;
}


.gallery-item.loaded::before {
    display: none;
}


@keyframes loading {

    from {
        background-position: 200% 0;
    }

    to {
        background-position: -200% 0;
    }

}


/* =========================
   FULLSCREEN VIEWER
========================= */

#viewer {

    position: fixed;

    inset: 0;

    z-index: 9999;

    display: none;

    align-items: center;
    justify-content: center;

    background: rgba(0, 0, 0, 0.95);

    padding: 70px 90px;
}


#viewer.active {
    display: flex;
}


/* Full quality image */

#viewerImage {

    max-width: 100%;
    max-height: 100%;

    width: auto;
    height: auto;

    object-fit: contain;

    user-select: none;
    -webkit-user-drag: none;

    border-radius: 3px;
}


/* =========================
   CLOSE BUTTON
========================= */

#closeButton {

    position: fixed;

    top: 16px;
    right: 20px;

    width: 50px;
    height: 50px;

    border: 0;
    border-radius: 50%;

    background: rgba(255,255,255,0.12);

    color: #fff;

    font-size: 36px;

    line-height: 46px;

    cursor: pointer;

    z-index: 10001;

    transition:
        background 0.15s ease,
        transform 0.15s ease;
}


#closeButton:hover {

    background: rgba(255,255,255,0.25);

    transform: scale(1.08);
}


/* =========================
   NAVIGATION
========================= */

.navButton {

    position: fixed;

    top: 50%;

    transform: translateY(-50%);

    width: 58px;
    height: 78px;

    border: 0;

    border-radius: 10px;

    background: rgba(255,255,255,0.12);

    color: #fff;

    font-size: 42px;

    cursor: pointer;

    z-index: 10000;

    transition:
        background 0.15s ease,
        transform 0.15s ease;
}


.navButton:hover {

    background: rgba(255,255,255,0.25);
}


#previousButton {
    left: 16px;
}


#nextButton {
    right: 16px;
}


/* =========================
   COUNTER
========================= */

#counter {

    position: fixed;

    bottom: 18px;

    left: 50%;

    transform: translateX(-50%);

    padding: 7px 13px;

    border-radius: 20px;

    background: rgba(0,0,0,0.65);

    color: #ddd;

    font-size: 14px;

    z-index: 10001;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 1200px) {

    #gallery {
        column-count: 4;
    }

}


@media (max-width: 900px) {

    #gallery {
        column-count: 3;
    }

}


@media (max-width: 600px) {

    header {
        padding: 20px 15px 14px;
    }

    h1 {
        font-size: 22px;
    }

    #gallery {

        padding: 6px 8px 25px;

        column-count: 2;

        column-gap: 8px;
    }

    .gallery-item {
        margin-bottom: 8px;
        border-radius: 7px;
    }

    #viewer {

        padding: 60px 48px;
    }

    .navButton {

        width: 42px;
        height: 60px;

        font-size: 30px;
    }

    #previousButton {
        left: 6px;
    }

    #nextButton {
        right: 6px;
    }

    #closeButton {

        top: 9px;
        right: 9px;

        width: 43px;
        height: 43px;

        font-size: 30px;
        line-height: 39px;
    }

}


/* =========================
   VERY SMALL PHONES
========================= */

@media (max-width: 380px) {

    #gallery {
        column-count: 2;
    }

}

</style>
</head>


<body>


<header>

    <h1>Image Gallery</h1>

    <div id="status">
        Loading images...
    </div>

</header>


<main id="gallery"></main>


<!-- =========================
     FULLSCREEN VIEWER
========================= -->

<div id="viewer">

    <button
        id="closeButton"
        aria-label="Close"
    >
        ×
    </button>


    <button
        class="navButton"
        id="previousButton"
        aria-label="Previous image"
    >
        ‹
    </button>


    <img
        id="viewerImage"
        alt=""
    >


    <button
        class="navButton"
        id="nextButton"
        aria-label="Next image"
    >
        ›
    </button>


    <div id="counter"></div>

</div>



<script>


/* =========================================================
   REPOSITORY SETTINGS
========================================================= */

const OWNER = "typeacc";

const REPOSITORY = "ImageAvailability";

const BRANCH = "main";

const IMAGE_FOLDER = "images";


/* GitHub API */

const API_URL =
    `https://api.github.com/repos/${OWNER}/${REPOSITORY}/contents/${IMAGE_FOLDER}?ref=${BRANCH}`;


/* Original full-quality images */

const RAW_BASE =
    `https://raw.githubusercontent.com/${OWNER}/${REPOSITORY}/${BRANCH}/${IMAGE_FOLDER}/`;



/* =========================================================
   ELEMENTS
========================================================= */

const gallery =
    document.getElementById("gallery");

const statusText =
    document.getElementById("status");

const viewer =
    document.getElementById("viewer");

const viewerImage =
    document.getElementById("viewerImage");

const closeButton =
    document.getElementById("closeButton");

const previousButton =
    document.getElementById("previousButton");

const nextButton =
    document.getElementById("nextButton");

const counter =
    document.getElementById("counter");



/* =========================================================
   VARIABLES
========================================================= */

let images = [];

let currentIndex = 0;



/* Supported image formats */

const imageExtensions = [

    ".jpg",
    ".jpeg",
    ".png",
    ".webp",
    ".gif",
    ".avif",
    ".bmp",
    ".svg"

];



/* =========================================================
   CHECK IMAGE
========================================================= */

function isImage(filename) {

    const lower =
        filename.toLowerCase();

    return imageExtensions.some(
        extension =>
            lower.endsWith(extension)
    );

}



/* =========================================================
   SAFE IMAGE URL
========================================================= */

function imageURL(filename) {

    return RAW_BASE +
        filename
            .split("/")
            .map(
                part =>
                    encodeURIComponent(part)
            )
            .join("/");

}



/* =========================================================
   CREATE GALLERY ITEM
========================================================= */

function createGalleryItem(filename, index) {


    const item =
        document.createElement("div");


    item.className =
        "gallery-item";


    const img =
        document.createElement("img");


    /*
        Lazy loading means the browser doesn't
        immediately download all 40+ images.
    */

    img.loading = "lazy";


    /*
        Allows the browser to decode the
        image without blocking the page.
    */

    img.decoding = "async";


    img.alt = filename;


    /*
        Use the original image for the
        gallery, but let the browser lazy-load it.
    */

    img.src =
        imageURL(filename);


    /*
        Image finished loading.
    */

    img.addEventListener(
        "load",
        () => {

            item.classList.add("loaded");

        },
        { once: true }
    );


    /*
        Broken image.
    */

    img.addEventListener(
        "error",
        () => {

            item.remove();

        },
        { once: true }
    );


    /*
        Click image.
    */

    item.addEventListener(
        "click",
        () => {

            openViewer(index);

        }
    );


    item.appendChild(img);

    return item;

}



/* =========================================================
   LOAD IMAGE LIST FROM GITHUB
========================================================= */

async function loadImages() {


    try {


        const response =
            await fetch(API_URL);


        if (!response.ok) {

            throw new Error(
                `GitHub API error: ${response.status}`
            );

        }


        const files =
            await response.json();


        /*
            Keep only actual image files.
        */

        images = files

            .filter(
                file =>
                    file.type === "file"
            )

            .filter(
                file =>
                    isImage(file.name)
            )

            .map(
                file =>
                    file.name
            )

            .sort(
                (a, b) =>
                    a.localeCompare(
                        b,
                        undefined,
                        {
                            numeric: true,
                            sensitivity: "base"
                        }
                    )
            );


        if (!images.length) {

            statusText.textContent =
                "No images found.";

            return;

        }


        statusText.textContent =
            `${images.length} images`;


        /*
            Create gallery items.

            The images themselves remain
            lazy-loaded by the browser.
        */

        const fragment =
            document.createDocumentFragment();


        images.forEach(
            (filename, index) => {

                fragment.appendChild(
                    createGalleryItem(
                        filename,
                        index
                    )
                );

            }
        );


        gallery.appendChild(fragment);


    } catch (error) {


        console.error(error);


        statusText.textContent =
            "Could not load the images.";


        gallery.innerHTML = `

            <div style="
                column-span: all;
                text-align: center;
                color: #aaa;
                padding: 50px 20px;
            ">

                Failed to load the image list from GitHub.

            </div>

        `;

    }

}



/* =========================================================
   OPEN FULLSCREEN
========================================================= */

function openViewer(index) {


    if (!images.length) {
        return;
    }


    currentIndex =
        index;


    viewer.classList.add(
        "active"
    );


    document.body.style.overflow =
        "hidden";


    showCurrentImage();

}



/* =========================================================
   SHOW FULL-QUALITY IMAGE
========================================================= */

function showCurrentImage() {


    const filename =
        images[currentIndex];


    /*
        IMPORTANT:

        This is the original full-quality
        image.

        It isn't loaded until the user
        clicks an image.
    */

    viewerImage.src =
        imageURL(filename);


    viewerImage.alt =
        filename;


    counter.textContent =
        `${currentIndex + 1} / ${images.length}`;


    previousButton.style.display =
        images.length > 1
            ? "block"
            : "none";


    nextButton.style.display =
        images.length > 1
            ? "block"
            : "none";

}



/* =========================================================
   PREVIOUS
========================================================= */

function previousImage() {


    if (!images.length) {
        return;
    }


    currentIndex =
        (
            currentIndex -
            1 +
            images.length
        ) % images.length;


    showCurrentImage();

}



/* =========================================================
   NEXT
========================================================= */

function nextImage() {


    if (!images.length) {
        return;
    }


    currentIndex =
        (
            currentIndex +
            1
        ) % images.length;


    showCurrentImage();

}



/* =========================================================
   CLOSE
========================================================= */

function closeViewer() {


    viewer.classList.remove(
        "active"
    );


    document.body.style.overflow =
        "";


    /*
        Free the full-resolution
        image after closing.
    */

    viewerImage.src =
        "";

}



/* =========================================================
   BUTTONS
========================================================= */

closeButton.addEventListener(
    "click",
    closeViewer
);


previousButton.addEventListener(
    "click",
    previousImage
);


nextButton.addEventListener(
    "click",
    nextImage
);



/* =========================================================
   CLICK OUTSIDE IMAGE
========================================================= */

viewer.addEventListener(
    "click",
    event => {


        if (
            event.target === viewer
        ) {

            closeViewer();

        }

    }
);



/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {


        if (
            !viewer.classList.contains(
                "active"
            )
        ) {

            return;

        }


        if (
            event.key === "Escape"
        ) {

            closeViewer();

        }


        if (
            event.key === "ArrowLeft"
        ) {

            previousImage();

        }


        if (
            event.key === "ArrowRight"
        ) {

            nextImage();

        }

    }
);



/* =========================================================
   START
========================================================= */

loadImages();


</script>

</body>
</html>
```
